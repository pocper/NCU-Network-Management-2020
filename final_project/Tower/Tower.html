<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>
        Tower
    </title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/Tower.css">
    <script type='text/javascript'>

        window.onload = function () {
            cts = document.getElementById('canvas')
            ctx = cts.getContext('2d')
            ctx.imageSmoothingEnabled = false;
            addEventListener('keydown', Key)
            requestAnimationFrame(game)
        }

        let halfPixel, pixel, grid
        let mapH, mapW
        let marginText
        let Weapon = []
        let Shield = []
        let MapColumn = {}

        let dx, dy
        let Delay, DelaySec
        let LastFloor
        let fresh
        let dir_x, dir_y
        let TenDigits
        let UnitDigits
        let FirstTime
        let press
        let LastMonster
        let MonsterHP
        let count
        let FloorValue
        let player = {}
        let Monster = []
        let Toward = []
        let map = []

        Reset()
        let image = new Image();
        image.src = './Atlas/atlas.png'

        function game() {

            Delay++
            if (FirstTime == 1) {
                graphic(0)
            }

            if (//判斷完全通關及死亡
                player.Floor == 4 && map[player.Floor][6 * mapW + 10] == 33 ||//過關
                player.HP < 0 || player.HP == 0) {//死亡

                if (player.HP < 0) {//死亡
                    player.HP = 0
                    graphic(1)
                }

                else if (
                    player.HP == 0 ||
                    player.Floor == 4 && map[player.Floor][6 * mapW + 10] == 33) {

                    ctx.globalAlpha = 0.005
                    ctx.fillStyle = 'gray'
                    ctx.fillRect(halfPixel, 0, (mapW - 1) * pixel, mapH * pixel)

                    ctx.globalAlpha = 1
                    ctx.textAlign = 'center'
                    ctx.textBaseline = 'middle'

                    if (player.HP == 0 && dx == 0 && dy == 0) {
                        ctx.fillStyle = 'red'
                        ctx.font = 'bold 48px Helvetica'
                        ctx.fillText('Game Over', (mapW / 2) * grid, (mapH / 2) * grid)
                    }

                    else if (player.Floor == 4 && map[player.Floor][6 * mapW + 10] == 33) {
                        ctx.fillStyle = 'Blue'
                        ctx.font = 'bold 48px Helvetica'
                        ctx.fillText('Congratulation', (mapW / 2) * grid, (mapH / 2) * grid)
                    }

                    count++

                    if (count < 50) {
                        ctx.globalAlpha = 1
                    }

                    else if (count > 50 && count < 150) {
                        ctx.globalAlpha = 0.5
                    }

                    else if (count > 150 && count < 300) {
                        ctx.globalAlpha = 0
                    }

                    else if (count > 300) {
                        count = 0
                    }

                    ctx.fillStyle = 'black'
                    ctx.font = 'bold 28px Helvetica'
                    ctx.fillText('【Press Any Key To Continue】', (mapW / 2) * grid, (mapH / 2) * grid + 5 * marginText)
                }

                if (press == 1) {
                    ctx.globalAlpha = 1
                    Reset()
                    graphic(1)
                }
            }

            if (player.HP > 0) {
                if (//靠近怪物顯示資訊
                    Math.floor(Toward[0] / 10) == MapColumn.Monster1 ||
                    Math.floor(Toward[1] / 10) == MapColumn.Monster1 ||
                    Math.floor(Toward[2] / 10) == MapColumn.Monster1 ||
                    Math.floor(Toward[3] / 10) == MapColumn.Monster1 ||
                    Math.floor(Toward[0] / 10) == MapColumn.Monster2 ||
                    Math.floor(Toward[1] / 10) == MapColumn.Monster2 ||
                    Math.floor(Toward[2] / 10) == MapColumn.Monster2 ||
                    Math.floor(Toward[3] / 10) == MapColumn.Monster2) {

                    if (Math.floor(Toward[0] / 10) == MapColumn.Monster1 || Math.floor(Toward[0] / 10) == MapColumn.Monster2) {
                        TenDigits = Math.floor(Toward[0] / 10)
                        UnitDigits = Toward[0] - 10 * TenDigits//[名字,生命值,攻擊值,防禦值]
                    }
                    else if (Math.floor(Toward[1] / 10) == MapColumn.Monster1 || Math.floor(Toward[1] / 10) == MapColumn.Monster2) {
                        TenDigits = Math.floor(Toward[1] / 10)
                        UnitDigits = Toward[1] - 10 * TenDigits//[名字,生命值,攻擊值,防禦值]
                    }
                    else if (Math.floor(Toward[2] / 10) == MapColumn.Monster1 || Math.floor(Toward[2] / 10) == MapColumn.Monster2) {
                        TenDigits = Math.floor(Toward[2] / 10)
                        UnitDigits = Toward[2] - 10 * TenDigits//[名字,生命值,攻擊值,防禦值]
                    }
                    else if (Math.floor(Toward[3] / 10) == MapColumn.Monster1 || Math.floor(Toward[3] / 10) == MapColumn.Monster2) {
                        TenDigits = Math.floor(Toward[3] / 10)
                        UnitDigits = Toward[3] - 10 * TenDigits//[名字,生命值,攻擊值,防禦值]
                    }

                    if ((UnitDigits) != LastMonster) {
                        MonsterHP = Monster[TenDigits - MapColumn.Monster1][UnitDigits][1]
                        LastMonster = UnitDigits
                    }
    
                    ctx.font = '18px Helvetica'
                    ctx.fillText(Monster[TenDigits - MapColumn.Monster1][UnitDigits][0], grid * (mapW - 4) +marginText, 7 * grid)
                    ctx.font = '16px Helvetica'
                    ctx.fillText('血量 : ' + MonsterHP, grid * (mapW - 4) + marginText, 8 * grid)
                    ctx.fillText('攻擊 : ' + Monster[TenDigits - MapColumn.Monster1][UnitDigits][2], grid * (mapW - 4) + marginText, 9 * grid)
                    ctx.fillText('防禦 : ' + Monster[TenDigits - MapColumn.Monster1][UnitDigits][3], grid * (mapW - 4) + marginText, 10 * grid)
                }

                if (press == 1 && Delay > DelaySec) {//有按
                    graphic(1)
                    Delay = 0

                    //控制上下左右
                    if (dx == -1 && dy == 0) {//向左
                        TenDigits = Math.floor(Toward[0] / 10)
                        UnitDigits = Toward[0] - 10 * TenDigits
                    }
                    else if (dx == 0 && dy == -1) {//向上
                        TenDigits = Math.floor(Toward[1] / 10)
                        UnitDigits = Toward[1] - 10 * TenDigits
                    }
                    else if (dx == 1 && dy == 0) {//向右
                        TenDigits = Math.floor(Toward[2] / 10)
                        UnitDigits = Toward[2] - 10 * TenDigits
                    }
                    else if (dx == 0 && dy == 1) {//向下
                        TenDigits = Math.floor(Toward[3] / 10)
                        UnitDigits = Toward[3] - 10 * TenDigits
                    }

                    //條件判斷
                    if (TenDigits == MapColumn.Villager ||
                        TenDigits == MapColumn.Brick ||
                        TenDigits == MapColumn.HalfBrick ||
                        TenDigits == MapColumn.ClosedDoor ||
                        TenDigits == MapColumn.Monster1 ||
                        TenDigits == MapColumn.Monster2) {//0牆壁 6 怪物

                        if (TenDigits == MapColumn.Monster1 || TenDigits == MapColumn.Monster2) {//Monster[名字,生命值,攻擊值,防禦值]

                            if (player.Defense < Monster[TenDigits - MapColumn.Monster1][UnitDigits][2]) {//怪物攻擊大於玩家防禦
                                player.HP -= Monster[TenDigits - MapColumn.Monster1][UnitDigits][2] - player.Defense//怪物攻擊玩家
                            }

                            if (player.Attack > Monster[TenDigits - MapColumn.Monster1][UnitDigits][3]) {//玩家攻擊大於怪物防禦
                                MonsterHP -= player.Attack - Monster[TenDigits - MapColumn.Monster1][UnitDigits][3]//玩家攻擊怪物
                            }

                            if (MonsterHP < 1) {
                                LastMonster = -1
                                if (player.Floor == 4) {
                                    FloorValue = 33
                                }
                                else {
                                    FloorValue = 31
                                }
                                map[player.Floor][mapW * (player.y + dy) + (player.x + dx)] = FloorValue
                            }
                            graphic(1)
                        }

                        else if (TenDigits == MapColumn.ClosedDoor) {
                            if (UnitDigits == 0) {//普通門
                                if (player.CopperKey > 0) {
                                    player.CopperKey--
                                    map[player.Floor][mapW * (player.y + dy) + (player.x + dx)] = 10 * MapColumn.OpenDoor + UnitDigits
                                    graphic(1)
                                }
                            }

                            else {//魔王門
                                if (player.SilverKey == 3) {
                                    player.SilverKey = 0
                                    map[player.Floor][mapW * (player.y + dy) + (player.x + dx)] = 10 * MapColumn.OpenDoor + UnitDigits
                                    graphic(1)
                                }

                                else {
                                    ctx.textAlign = 'center'
                                    ctx.textBaseline = 'top'
                                    ctx.font = '14px Helvetica'
                                    ctx.fillStyle = 'black'
                                    ctx.drawImage(image, 3 * grid, MapColumn.Villager * grid, 4 * grid, grid, 12.7 * grid, 4.8 * grid, 3.5 * grid, grid)
                                    ctx.fillText('餵我三隻銀鑰匙', 14.4 * pixel, 5.1 * pixel)
                                }
                            }
                        }

                        else if (TenDigits == MapColumn.Villager) {

                            ctx.textAlign = 'center'
                            ctx.textBaseline = 'top'
                            ctx.font = '14px Helvetica'

                            if (UnitDigits == 0) {
                                ctx.fillStyle = 'black'
                                ctx.drawImage(image, 3 * grid, MapColumn.Villager * grid, 4 * grid, grid, 7.5 * grid, 6 * grid, 4 * grid, grid)
                                ctx.fillText('還不去放你的暑假', 9.5 * pixel, 6.3 * pixel)
                                map[player.Floor][mapW * (player.y + dy) + (player.x + dx)] = 31
                            }

                            else if (UnitDigits == 1) {
                                ctx.fillStyle = 'black'
                                ctx.drawImage(image, 3 * grid, MapColumn.Villager * grid, 4 * grid, grid, 6 * grid, 4 * grid, 4.8 * grid, grid)
                                ctx.fillText('送你裝備，祝挑戰成功', 8.3 * pixel, 4.3 * pixel)
                                map[player.Floor][mapW * (player.y + dy) + (player.x + dx)] = 32
                                map[player.Floor][mapW * 7 + 7] = 130
                                map[player.Floor][mapW * 5 + 5] = 140
                            }

                            else if (UnitDigits == 2) {
                                ctx.fillStyle = 'blue'
                                ctx.drawImage(image, 3 * grid, MapColumn.Villager * grid, 4 * grid, grid, 7.7 * grid, 5 * grid, 3.5 * grid, grid)
                                ctx.fillText('找三把銀鑰匙', 9.5 * pixel, 5.3 * pixel)
                                map[player.Floor][mapW * (player.y + dy) + (player.x + dx)] = 32
                            }
                        }

                        if (dx == -1 && dy == 0) {
                            dir_x = -1
                            dx = 0
                        }
                        else if (dx == 0 && dy == -1) {
                            dir_y = -1
                            dy = 0
                        }
                        else if (dx == 1 && dy == 0) {
                            dir_x = 1
                            dx = 0
                        }
                        else if (dx == 0 && dy == 1) {
                            dir_y = 1
                            dy = 0
                        }
                    }

                    else if (TenDigits == MapColumn.UpStair || TenDigits == MapColumn.DownStair) {//3向上 4下階梯
                        LastFloor = player.Floor
                        if (TenDigits == MapColumn.UpStair) {
                            player.Floor++
                        }
                        else {
                            player.Floor--
                        }
                    }

                    else if (TenDigits == MapColumn.OpenDoor && UnitDigits == 1) {
                        player.Floor = 4
                        player.x = 10
                        player.y = 9
                        dx = dy = 0
                        graphic(0)
                    }

                    else if (TenDigits == MapColumn.Key) {//鑰匙
                        if (UnitDigits == 0) {
                            player.CopperKey++
                        }
                        else {
                            player.SilverKey++
                        }

                        map[player.Floor][mapW * (player.y + dy) + (player.x + dx)] = 31
                        graphic(1)
                    }

                    else if (TenDigits == MapColumn.Potion) {//8 藥水
                        if (UnitDigits == 0) {
                            player.HP++
                        }

                        else {
                            player.Attack++
                            player.Defense++
                        }
                        if (player.Floor == 3) {
                            FloorValue = 33
                        }
                        else {
                            FloorValue = 31
                        }

                        map[player.Floor][mapW * (player.y + dy) + (player.x + dx)] = FloorValue
                        graphic(1)
                    }

                    else if (TenDigits == MapColumn.Weapon || TenDigits == MapColumn.Shield) {//9 武器 10盾

                        if (TenDigits == MapColumn.Weapon) {
                            player.Weapon = UnitDigits + 1
                            if (player.Weapon > 0) {
                                player.Attack += Weapon[player.Weapon][1] - Weapon[player.Weapon - 1][1]
                            }
                            else {
                                player.Attack += Weapon[player.Weapon][1]
                            }
                        }

                        else {
                            player.Shield = UnitDigits + 1

                            if (player.Shield > 0) {
                                player.Defense += Shield[player.Shield][1] - Shield[player.Shield - 1][1]
                            }
                            else {
                                player.Defense += Shield[player.Shield][1]
                            }

                        }
                        if (player.Floor == 1) {
                            FloorValue = 32
                        }
                        else {
                            FloorValue = 31
                        }

                        map[player.Floor][mapW * (player.y + dy) + (player.x + dx)] = FloorValue
                        graphic(1)
                    }

                    player.x += dx
                    player.y += dy

                    Toward[0] = map[player.Floor][mapW * (player.y) + (player.x - 1)]//向左
                    Toward[1] = map[player.Floor][mapW * (player.y - 1) + (player.x)]//向上
                    Toward[2] = map[player.Floor][mapW * (player.y) + (player.x + 1)]//向右
                    Toward[3] = map[player.Floor][mapW * (player.y + 1) + (player.x)]//向下

                    //撞牆與否及對應的顯示
                    if (dx == -1 && dy == 0 || dir_x == -1) {//向左
                        ctx.drawImage(image, 0 * halfPixel, MapColumn.Player * pixel, halfPixel, halfPixel, grid * player.x, grid * player.y, grid, grid)
                    }

                    else if (dx == 0 && dy == -1 || dir_y == -1) {//向上
                        ctx.drawImage(image, 1 * halfPixel, MapColumn.Player * pixel, halfPixel, halfPixel, grid * player.x, grid * player.y, grid, grid)
                    }

                    else if (dx == 1 && dy == 0 || dir_x == 1) {//向右
                        ctx.drawImage(image, 2 * halfPixel, MapColumn.Player * pixel, halfPixel, halfPixel, grid * player.x, grid * player.y, grid, grid)
                    }

                    else if (dx == 0 && dy == 1 || dir_y == 1) {//向下
                        ctx.drawImage(image, 3 * halfPixel, MapColumn.Player * pixel, halfPixel, halfPixel, grid * player.x, grid * player.y, grid, grid)
                    }
                    //

                    //console.log('Floor=', player.Floor)
                    //console.log('Now', '(', player.x, ',', player.y, ')')
                    //console.log('dx=', dx, 'dy=', dy)
                    //console.log('l:', Toward[0], 'u:', Toward[1], 'r:', Toward[2], 'd:', Toward[3])

                    dir_x = dir_y = 0
                    dx = dy = 0
                    press = 0
                    //控制結束
                }
            }

            if (LastFloor != player.Floor && LastFloor != -1) {//樓梯上下樓判斷
                for (let i = 0; i < mapH; i++) {
                    for (let j = 0; j < mapW; j++) {
                        let value = map[player.Floor][mapW * i + j]
                        let value_TenDigit = Math.floor(value / 10)

                        if (LastFloor < player.Floor && value_TenDigit == MapColumn.DownStair) {
                            player.x = j
                            player.y = i
                            break
                        }

                        else if (LastFloor > player.Floor && value_TenDigit == MapColumn.UpStair) {
                            player.x = j
                            player.y = i
                            break
                        }
                    }
                }
                //console.log('playerFloor=', player.Floor + 1)
                //console.log('ads', '(', player.x, ',', player.y, ')')
                Toward[0] = map[player.Floor][mapW * (player.y) + (player.x - 1)]//向左
                Toward[1] = map[player.Floor][mapW * (player.y - 1) + (player.x)]//向上
                Toward[2] = map[player.Floor][mapW * (player.y) + (player.x + 1)]//向右
                Toward[3] = map[player.Floor][mapW * (player.y + 1) + (player.x)]//向下
                LastFloor = player.Floor
                graphic(0)
            }

            requestAnimationFrame(game)
        }

        function graphic(fresh) {

            for (let i = 0; i < mapH; i++) {
                for (let j = 0; j < mapW; j++) {
                    let value = map[player.Floor][mapW * i + j]
                    let value_TenDigit = Math.floor(value / 10)
                    ctx.drawImage(image, (value % 10) * pixel, value_TenDigit * pixel, pixel, pixel, grid * j, grid * i, grid, grid);
                }
            }

            ctx.textAlign = 'left'
            ctx.textBaseline = 'top'
            ctx.fillStyle = 'white'
            ctx.font = 'bold 16px Helvetica'
            ctx.fillText('武器', grid * (mapW - 4) + marginText * 1.5, 1.2 * grid)
            ctx.fillText('防具', grid * (mapW - 4) + marginText * 1.5, 3.8 * grid)

            ctx.font = '16px Helvetica'
            ctx.fillText(Weapon[player.Weapon][0], grid * (mapW - 4) + marginText * 1.5, 2.2 * grid)
            ctx.fillText(Shield[player.Shield][0], grid * (mapW - 4) + marginText * 1.5, 4.8 * grid)
            ctx.fillText('血量 : ' + player.HP, grid * 1 + marginText, 4 * grid)
            ctx.fillText('攻擊 : ' + player.Attack, grid * 1 + marginText, 5 * grid)
            ctx.fillText('防禦 : ' + player.Defense, grid * 1 + marginText, 6 * grid)
            ctx.fillText('銅鑰匙 : ' + player.CopperKey, grid * 1 + marginText, 8 * grid)
            ctx.fillText('銀鑰匙 : ' + player.SilverKey, grid * 1 + marginText, 9 * grid)

            ctx.font = 'bold 18px Helvetica'
            if (player.Floor < 4) {
                ctx.fillText('第' + (player.Floor + 1) + '層', grid * 1 + 2.5 * marginText, 2 * grid)
            }
            else if (player.Floor == 4) {
                ctx.fillText('魔王層', grid * 1 + 2 * marginText, 2 * grid)
            }

            if (fresh == 0) {//初始設定角色位置
                FirstTime = 0
                ctx.drawImage(image, 3 * halfPixel, MapColumn.Player * pixel, halfPixel, halfPixel, grid * player.x, grid * player.y, grid, grid)
            }
        }

        function Reset() {
            halfPixel = 16, pixel = 32, grid = 32
            mapH = 13, mapW = 21
            marginText = 10
            Weapon = [//[名字,攻擊]
                ['', 0],
                ['法國麵包', 5],
                ['詛咒藍刀', 15],
                ['黑刀', 30],
                ['阿不就好棒', 50]
            ]

            Shield = [//[名字,防禦]
                ['', 0],
                ['木盾', 3],
                ['鐵盾', 5],
                ['蘭盾', 10]
            ]

            MapColumn = {
                Brick: 0,
                Desert: 1,
                HalfBrick: 2,
                Floor: 3,
                UpStair: 4,
                DownStair: 5,
                ClosedDoor: 6,
                OpenDoor: 7,
                Monster1: 8,
                Monster2: 9,
                Villager: 10,
                Key: 11,
                Potion: 12,
                Weapon: 13,
                Shield: 14,
                Player: 15
            }

            dx = dy = 0
            Delay = 0
            DelaySec = 20
            LastFloor = -1
            fresh = 0
            dir_x = dir_y = 0
            TenDigits = UnitDigits = 0
            FirstTime = 1
            press = 0
            LastMonster = -1
            MonsterHP = 0
            count = 0
            player = {
                x: 10,
                y: 11,
                Floor: 0,
                HP: 100,
                Attack: 5,
                Defense: 0,
                Weapon: 0,
                Shield: 0,
                CopperKey: 0,
                SilverKey: 0
            }
            Monster = [[//[名字,生命值,攻擊值,防禦值]
                ['木乃伊', 5, 3, 1],
                ['藍蛇', 3, 5, 0],
                ['青蛇', 5, 3, 0],
                ['醜男', 10, 7, 3],
                ['巫師', 6, 10, 1],
                ['吸血鬼', 10, 12, 2],
                ['低級骷髏', 10, 5, 2],
                ['高級骷髏', 20, 10, 4],
                ['超高級骷髏', 30, 15, 6],

            ],
            [
                ['蝙蝠', 8, 4, 2],
                ['黃金木乃伊', 20, 10, 4],
                ['木乃伊', 5, 10, 1],
                ['黑魔導', 40, 30, 5],
                ['黑魔導左手', 30, 20, 9],
                ['黑魔導右手', 30, 25, 8],
                ['魔王', 100, 50, 10]
            ]
            ]

            Toward = [0, 0, 0, 0]//左 上 右 下
            map = [
                [//第一層地圖
                    23, 00, 00, 00, 21, 01, 01, 01, 01, 01, 01, 01, 01, 01, 01, 01, 20, 00, 00, 00, 22,
                    23, 04, 04, 04, 21, 40, 31, 81, 82, 81, 31, 31, 31, 31, 31, 31, 20, 04, 04, 04, 22,
                    23, 04, 04, 04, 21, 01, 01, 01, 01, 01, 01, 01, 01, 01, 01, 31, 20, 04, 04, 04, 22,
                    23, 04, 04, 04, 21, 120, 31, 31, 60, 31, 01, 120, 110, 31, 01, 31, 20, 25, 25, 25, 22,
                    23, 04, 04, 04, 21, 31, 86, 31, 01, 31, 01, 121, 120, 31, 01, 31, 20, 04, 04, 04, 22,
                    23, 04, 04, 04, 21, 01, 60, 01, 01, 31, 01, 01, 01, 60, 01, 31, 20, 04, 04, 04, 22,
                    23, 04, 04, 04, 21, 110, 31, 111, 01, 31, 60, 90, 84, 90, 01, 31, 20, 25, 25, 25, 22,
                    23, 04, 04, 04, 21, 31, 87, 31, 01, 100, 01, 01, 01, 01, 01, 31, 20, 04, 04, 04, 22,
                    23, 04, 04, 04, 21, 01, 60, 01, 01, 31, 31, 31, 31, 31, 31, 31, 20, 04, 04, 04, 22,
                    23, 04, 04, 04, 21, 31, 31, 31, 01, 01, 60, 01, 01, 01, 60, 01, 20, 04, 04, 04, 22,
                    23, 04, 04, 04, 21, 120, 31, 110, 01, 110, 31, 31, 01, 31, 90, 31, 20, 04, 04, 04, 22,
                    23, 04, 04, 04, 21, 120, 133, 110, 01, 31, 31, 31, 01, 81, 121, 81, 20, 04, 04, 04, 22,
                    23, 00, 00, 00, 21, 01, 01, 01, 01, 01, 01, 01, 01, 01, 01, 01, 20, 00, 00, 00, 22,
                ],

                [//第二層地圖
                    23, 00, 00, 00, 21, 01, 01, 01, 01, 01, 01, 01, 01, 01, 01, 01, 20, 00, 00, 00, 22,
                    23, 04, 04, 04, 21, 32, 52, 32, 13, 02, 02, 33, 03, 03, 03, 03, 20, 04, 04, 04, 22,
                    23, 04, 04, 04, 21, 32, 32, 32, 13, 02, 02, 33, 03, 03, 03, 03, 20, 04, 04, 04, 22,
                    23, 04, 04, 04, 21, 32, 32, 32, 13, 02, 02, 33, 03, 03, 03, 03, 20, 25, 25, 25, 22,
                    23, 04, 04, 04, 21, 32, 32, 32, 13, 02, 02, 33, 03, 03, 03, 03, 20, 04, 04, 04, 22,

        function Key(e) {
            press = 1
            switch (e.keyCode) {
                case 37://左鍵

                    dx = -1
                    dy = 0
                    break

                case 38://上鍵

                    dx = 0
                    dy = -1
                    break

                case 39://右鍵

                    dx = 1
                    dy = 0
                    break

                case 40://下鍵

                    dx = 0
                    dy = 1
                    break

                case 88://上層x
                    if (player.Floor < (map.length - 1)) {
                        LastFloor = player.Floor

                        player.Floor++
                    }
                    break

                case 90://下層z
                    if (player.Floor > 0) {
                        LastFloor = player.Floor

                        player.Floor--
                    }
                    break

                default:
                    press=0
                    break
            }
        }
