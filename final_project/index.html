<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>
        my Website
    </title>
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <script src="javascript/main.js"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css">
</head>

<body>

    <section>
        <div class="intro">
            <div class="intro-box">
                <div class="logo-box">
                    <div class="logo">
                        <img src="image/logo.png" width="400px" height="400px">
                    </div>
                    <div class="logo-txt">
                        Game
                    </div>
                </div>

                <div class="txt-box">
                    <div>
                        兩位學生做出來的遊戲網站<br />
                        Two Students make this Website page.
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section>
        <main>
            <header>
                <div>
                    <button class="header-btn" onclick="Page('AboutUs')">關於我們</button>
                </div>
                <div>
                    <button class="header-btn" onclick="Page('Home')">首頁</button>
                </div>
            </header>

            <div class="Content">

                <div class="search-box">
                    <a class="search-btn">
                        <i class="fas fa-search"></i>
                    </a>
                    <input id="text" class="search-txt" type="text" placeholder="Search">
                </div>

                <div class="G-txt">
                    <div class="G-txt1">
                        <div class="G-txt2">

                            <i class="fas fa-chess-rook"></i>
                            <h1>
                                魔塔
                            </h1>
                            <p>
                                1996年推出的解謎類電子角色扮演遊戲<br />魔塔是所有魔塔遊戲的祖宗
                            </p>
                        </div>

                        <button onclick="Page('Tower')">前往</button>
                    </div>

                    <div class="G-txt1">
                        <div class="G-txt2">
                            <img src="image/snake.svg"></img>
                            <h1>
                                貪吃蛇
                            </h1>
                            <p>
                                1976年的街機遊戲Blockade<br />1990年代由於小型螢幕手機引入而流行起來
                            </p>
                        </div>

                        <button onclick="Page('Snake')">前往</button>
                    </div>
                </div>
            </div>

            <footer>
                <div>
                    2020/7/3 機械系網管期末專題<br />
                    &copy;2020 copyright
                </div>
            </footer>
        </main>

    </section>

</body>

</html>
